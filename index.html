<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알고케어 유저 후기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 알고케어 브랜드 토큰 (커머스 표준 · 라이트) */
  :root {
    --n50: #FAF9F9;   /* 바탕 */
    --n100: #F5F3F2;  /* 카드 면 */
    --n200: #ECE9E8;  /* 트랙 */
    --n600: #958D8B;  /* 캡션 */
    --n800: #534C4B;  /* 서브 텍스트 */
    --n900: #211D1D;  /* 본문 텍스트 */
    --paper: #FFFFFF;
    --wo: #F47B1A;    /* Wonder Orange — 점·진행바·제안 pill에만 */
    /* 16:9 화면 기준 1단위. 어떤 해상도의 TV에서도 비율이 유지된다 */
    --u: min(1vw, 1.7778vh);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--n50); overflow: hidden; cursor: none; }
  body {
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
    color: var(--n900);
    display: grid; place-items: center;
  }
  .stage {
    width: calc(100 * var(--u)); height: calc(56.25 * var(--u));
    display: grid; grid-template-rows: auto 1fr;
  }
  /* 상단 전체를 채우는 배너 (로고 + 제목 포함, 2000×296) */
  .banner { width: 100%; height: auto; display: block; }
  .content {
    min-height: 0;
    padding: calc(3 * var(--u)) calc(5.4 * var(--u)) calc(3.6 * var(--u));
    display: grid; grid-template-rows: 1fr auto; gap: calc(2 * var(--u));
  }

  main { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .pill {
    align-self: flex-start;
    margin-bottom: calc(1.6 * var(--u));
    padding: calc(0.5 * var(--u)) calc(1.2 * var(--u));
    border-radius: 999px; background: var(--wo); color: var(--paper);
    font-size: calc(1.2 * var(--u)); font-weight: 600; letter-spacing: -0.02em;
  }
  .pill[hidden] { display: none; }
  .quote {
    font-weight: 600; color: var(--n900);
    line-height: 1.45; letter-spacing: -0.03em;
    white-space: pre-line; word-break: keep-all; overflow-wrap: break-word; text-wrap: balance;
  }

  footer { display: flex; align-items: flex-end; gap: calc(4 * var(--u)); }
  .footer-left { flex: 1; display: grid; gap: calc(1.8 * var(--u)); padding-bottom: calc(0.4 * var(--u)); }
  .meta {
    display: flex; align-items: center; gap: calc(1 * var(--u));
    font-size: calc(1.5 * var(--u)); color: var(--n600); font-weight: 500; letter-spacing: -0.02em;
  }
  .meta .author { color: var(--n800); font-weight: 600; }
  .meta .dot { width: calc(0.3 * var(--u)); height: calc(0.3 * var(--u)); border-radius: 50%; background: var(--n600); }
  .progress-row { display: flex; align-items: center; gap: calc(1.4 * var(--u)); }
  .progress { flex: 1; height: 3px; background: var(--n200); overflow: hidden; border-radius: 3px; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--wo); }
  .count { font-size: calc(1.1 * var(--u)); color: var(--n600); font-variant-numeric: tabular-nums; font-weight: 600; }

  .qr-card {
    width: calc(12.6 * var(--u));
    background: var(--n100); border-radius: calc(1.2 * var(--u));
    padding: calc(1 * var(--u)) calc(1 * var(--u)) calc(0.9 * var(--u));
    display: grid; gap: calc(0.7 * var(--u)); justify-items: center;
  }
  .qr { width: 100%; aspect-ratio: 1; border-radius: calc(0.6 * var(--u)); overflow: hidden; background: var(--paper); }
  .qr svg { width: 100%; height: 100%; display: block; }
  .qr-label { font-size: calc(1.2 * var(--u)); color: var(--n800); font-weight: 600; letter-spacing: -0.02em; }

  /* 전환 */
  .swap { transition: opacity .7s ease, transform .7s ease; }
  .out .swap { opacity: 0; transform: translateY(calc(0.8 * var(--u))); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="banner" src="logo.jpg" alt="algocare 유저들의 감사한 후기">
  <div class="content">
  <main class="swap">
    <div class="pill" id="pill" hidden>고객 제안</div>
    <p class="quote" id="quote"></p>
  </main>
  <footer>
    <div class="footer-left">
      <div class="meta swap" id="meta"></div>
      <div class="progress-row">
        <div class="progress"><i id="bar"></i></div>
        <div class="count" id="count"></div>
      </div>
    </div>
    <div class="qr-card swap">
      <div class="qr" id="qr"></div>
      <div class="qr-label">원문 보기</div>
    </div>
  </footer>
  </div>
</div>

<script>
  // 6시간마다 새로고침해서 reviews.js 갱신분을 반영한다
  const RELOAD_MS = 6 * 60 * 60 * 1000;
  const startedAt = Date.now();

  const s = document.createElement('script');
  s.src = 'reviews.js?v=' + Math.floor(startedAt / RELOAD_MS);
  s.onload = start;
  s.onerror = () => document.getElementById('quote').textContent = '후기를 불러오지 못했어요';
  document.head.appendChild(s);

  // 가장 긴 줄이 한 줄에 들어가도록 멘트 크기 조절 (한글 ≈ 0.94em, 공백 ≈ 0.3em)
  function fontSizeFor(text) {
    const lines = text.split('\n');
    const widest = Math.max(...lines.map(l => {
      const spaces = (l.match(/\s/g) || []).length;
      return (l.length - spaces) * 0.94 + spaces * 0.3;
    }));
    const byWidth = 82 / widest;
    const byHeight = 22 / (1.45 * lines.length);
    // 기본 크기에서 20% 줄인 값
    return 0.8 * Math.max(2.6, Math.min(4.6, byWidth, byHeight));
  }
  // 읽는 시간: 기본 9초 + 글자당 0.08초, 최대 18초
  function durationFor(text) {
    const n = text.replace(/\s/g, '').length;
    return Math.min(18000, 9000 + n * 80);
  }
  function fmtDate(d) { return d ? d.replaceAll('-', '.') : ''; }

  function render(r, i, total) {
    document.getElementById('pill').hidden = r.kind !== 'wish';
    const q = document.getElementById('quote');
    q.textContent = r.text;
    // 추정 크기로 시작해서, 실제로 넘치면 0.1단위씩 줄인다
    const main = q.parentElement;
    const pill = document.getElementById('pill');
    const overflows = () => {
      const box = main.getBoundingClientRect();
      const top = (pill.hidden ? q : pill).getBoundingClientRect().top;
      return top < box.top - 1 || q.getBoundingClientRect().bottom > box.bottom + 1;
    };
    let fs = fontSizeFor(r.text);
    q.style.fontSize = `calc(${fs} * var(--u))`;
    while (fs > 2 && overflows()) {
      fs -= 0.1;
      q.style.fontSize = `calc(${fs} * var(--u))`;
    }
    const meta = document.getElementById('meta');
    meta.innerHTML = '';
    [['author', r.author], ['', r.platform], ['', fmtDate(r.date)]].filter(([, v]) => v).forEach(([cls, v], k) => {
      if (k) { const d = document.createElement('span'); d.className = 'dot'; meta.appendChild(d); }
      const el = document.createElement('span'); el.className = cls; el.textContent = v; meta.appendChild(el);
    });
    document.getElementById('qr').innerHTML = r.qr;
    document.getElementById('count').textContent = `${i + 1} / ${total}`;
  }

  function start() {
    const list = window.REVIEWS || [];
    const stage = document.getElementById('stage');
    if (!list.length) { document.getElementById('quote').textContent = '아직 등록된 후기가 없어요'; return; }

    let i = 0, timer = null;
    const bar = document.getElementById('bar');

    function show(idx, animate = true) {
      i = (idx + list.length) % list.length;
      const go = () => {
        render(list[i], i, list.length);
        stage.classList.remove('out');
        const ms = durationFor(list[i].text);
        bar.style.transition = 'none'; bar.style.width = '0';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          bar.style.transition = `width ${ms}ms linear`; bar.style.width = '100%';
        }));
        clearTimeout(timer);
        timer = setTimeout(next, ms);
      };
      if (!animate) return go();
      stage.classList.add('out');
      setTimeout(go, 700);
    }
    function next() {
      // 한 바퀴 돌았고 새로고침 시간이 지났으면 새로고침
      if (i === list.length - 1 && Date.now() - startedAt > RELOAD_MS) return location.reload();
      show(i + 1);
    }

    // 테스트용: ← → 키로 넘기기, F 키 또는 클릭으로 전체화면
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') show(i + 1);
      if (e.key === 'ArrowLeft') show(i - 1);
      if (e.key === 'f' || e.key === 'F') document.documentElement.requestFullscreen?.();
    });
    document.addEventListener('click', () => document.documentElement.requestFullscreen?.());

    show(0, false);
  }
</script>
</body>
</html>
